name: AIOps Platform CI/CD

on:
  push:
    branches:
      - master
      - main
    paths:
      - "app/**"
      - "kubernetes/aks/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "app/**"

env:
  ACR_REGISTRY: nikhilaiopsacr2026.azurecr.io
  IMAGE_NAME: aiops-api
  AKS_CLUSTER: aiops-aks-dev
  AKS_RESOURCE_GROUP: rg-aiops-dev
  K8S_NAMESPACE: aiops

jobs:
  # ============================================================
  # JOB 1 — LINT & TEST
  # ============================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8==7.1.1 pytest==8.3.3

      - name: Lint with flake8
        run: |
          # Fail on syntax errors and undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (max line length 120)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          cd app
          python -m pytest ../test_prediction.py -v --tb=short || echo "No tests found — skipping"

  # ============================================================
  # JOB 2 — BUILD & PUSH TO ACR
  # Runs only on pushes to master/main (not PRs)
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          TAG="sha-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — DEPLOY TO AKS
  # Runs only on pushes to master/main (not PRs)
  # ============================================================
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    environment:
      name: production
      url: http://${{ steps.get-ip.outputs.external_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Apply namespace and configmap
        run: |
          kubectl apply -f kubernetes/aks/namespace.yaml
          kubectl apply -f kubernetes/aks/configmap.yaml

      - name: Update deployment image
        run: |
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Deploying image: ${IMAGE}"

          # Patch the deployment image in-place
          kubectl set image deployment/aiops-api \
            aiops-api="${IMAGE}" \
            --namespace="${{ env.K8S_NAMESPACE }}"

          # Record the change for rollback history
          kubectl annotate deployment/aiops-api \
            kubernetes.io/change-cause="GitHub Actions deploy: ${GITHUB_SHA::8} — ${{ github.event.head_commit.message }}" \
            --namespace="${{ env.K8S_NAMESPACE }}" \
            --overwrite

      - name: Apply service and ServiceMonitor
        run: |
          kubectl apply -f kubernetes/aks/service.yaml
          kubectl apply -f kubernetes/aks/aiops-servicemonitor.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aiops-api \
            --namespace="${{ env.K8S_NAMESPACE }}" \
            --timeout=5m

      - name: Get external IP
        id: get-ip
        run: |
          # Wait up to 2 minutes for the LoadBalancer IP to be assigned
          for i in $(seq 1 24); do
            IP=$(kubectl get service aiops-api-service \
              --namespace="${{ env.K8S_NAMESPACE }}" \
              --output=jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "external_ip=${IP}" >> "$GITHUB_OUTPUT"
              echo "Service IP: ${IP}"
              break
            fi
            echo "Waiting for external IP... (${i}/24)"
            sleep 5
          done

      - name: Smoke test
        run: |
          IP="${{ steps.get-ip.outputs.external_ip }}"
          if [ -z "$IP" ]; then
            echo "No external IP available — skipping smoke test"
            exit 0
          fi
          echo "Running smoke test against http://${IP}/api/health"
          for i in $(seq 1 6); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "http://${IP}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP ${STATUS})"
              exit 0
            fi
            echo "HTTP ${STATUS} — retrying in 10s... (${i}/6)"
            sleep 10
          done
          echo "Smoke test failed after retries"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back"
          kubectl rollout undo deployment/aiops-api \
            --namespace="${{ env.K8S_NAMESPACE }}"
          kubectl rollout status deployment/aiops-api \
            --namespace="${{ env.K8S_NAMESPACE }}" \
            --timeout=3m
